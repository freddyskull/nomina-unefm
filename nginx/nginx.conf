user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 64M;

    # Gzip
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream de la app
    upstream nomina_app {
        server app:80;
    }

    # Redirección HTTP -> HTTPS
    server {
        listen 80;
        server_name nomina.unefm.edu.ve;
        return 301 https://$host$request_uri;
    }

    # Principal
    server {
        listen 443 ssl http2;
        server_name nomina.unefm.edu.ve;

        # Certificados (obtener con certbot o montarlos aquí)
        ssl_certificate     /etc/ssl/certs/nomina.unefm.edu.ve.crt;
        ssl_certificate_key /etc/ssl/private/nomina.unefm.edu.ve.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Cabeceras de seguridad
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        location / {
            proxy_pass http://nomina_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_redirect off;
            proxy_read_timeout 300;
            proxy_send_timeout 300;
        }

        # Archivos estáticos directos
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|pdf|zip)$ {
            proxy_pass http://nomina_app;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Logs
        access_log /var/log/nginx/nomina.access.log;
        error_log  /var/log/nginx/nomina.error.log;
    }
}
