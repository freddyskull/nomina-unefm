services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nomina-unefm-app
    expose:
      - "80"
    volumes:
      - .:/var/www/html
    environment:
      - TZ=America/Caracas
      # URL pública; el puerto 80 lo enruta el nginx principal (unefm-nginx)
      # Debe ser https: el gateway termina TLS en 443. Si queda en http, los
      # formularios se envian en claro y el navegador avisa que la
      # informacion no es segura.
      - APP_URL=https://nomina2.unefm.edu.ve
    restart: always
    networks:
      - nomina_net

  proxy:
    image: nginx:1.25-alpine
    container_name: nomina-unefm-proxy
    depends_on:
      - app
    # Sin puerto publicado en el host: solo lo alcanza el nginx principal
    # (unefm-nginx) vía la red compartida nomina_net.
    expose:
      - "80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
    networks:
      - nomina_net

networks:
  nomina_net:
    driver: bridge

# Nota: No incluimos una base de datos local porque el sistema
# está configurado para conectarse a una DB Oracle externa (150.187.4.18)
