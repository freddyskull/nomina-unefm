# Para desarrollo local: comentar el bloque proxy en docker-compose.yml
# y usar solo el servicio app (puerto 8083).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nomina-unefm-app
    ports:
      - "8083:80"
    volumes:
      - .:/var/www/html
    environment:
      - TZ=America/Caracas
      # URL pública que codifica el QR de validación (override con APP_URL=...)
      - APP_URL=${APP_URL:-http://10.10.10.12:8083}
    restart: always
